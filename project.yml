name: HerdrM
options:
  bundleIdPrefix: dev.bybee
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  developmentRegion: en
  knownRegions:
    - en
    - zh-Hans
packages:
  HerdrKit:
    path: Packages/HerdrKit
  HerdrSSH:
    path: Packages/HerdrSSH
  HerdrTailcat:
    path: Packages/HerdrTailcat
  libghostty-spm:
    url: https://github.com/Lakr233/libghostty-spm.git
    from: "1.6.20260909"
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.9.6"
targets:
  HerdrM:
    type: application
    platform: macOS
    sources:
      - Sources/HerdrM
      - path: Resources
        buildPhase: resources
        excludes:
          - Localizable.xcstrings
      - path: Resources/Localizable.xcstrings
    dependencies:
      - package: HerdrKit
      - package: HerdrTailcat
      - package: libghostty-spm
        product: GhosttyTerminal
      - package: Sparkle
    info:
      path: Sources/HerdrM/Info.plist
      properties:
        CFBundleName: herdrm
        CFBundleDisplayName: herdrm
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.developer-tools
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        NSPrincipalClass: NSApplication
        NSHumanReadableCopyright: "© 2026 MOE AI LLC"
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations:
          - en
          - zh-Hans
        SUFeedURL: https://github.com/missuo/herdrm/releases/latest/download/appcast.xml
        SUPublicEDKey: RHEhllstUuuVrVDCPGrbhg/8LivSzpuZB9X3u3xdV5o=
        SUEnableAutomaticChecks: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.bybee.herdrm
        PRODUCT_NAME: herdrm
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_VERSION: "5.10"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        COMBINE_HIDPI_IMAGES: YES
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: NCFNX3LJ83
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
      configs:
        Debug:
          # 本机开发：Manual + Apple Development 证书直接签（codesign 手动签
          # 验证可行）。用证书 SHA-1 指纹而不是 "Apple Development"——这个 Xcode
          # beta 给 macOS 匹配证书时会去找旧版 "Mac Development" 类型而忽略通用
          # 名，按指纹则精确命中。app 无 entitlements、不开沙盒，本地通知不需要 profile。
          CODE_SIGN_STYLE: Manual
          DEVELOPMENT_TEAM: 2F5DQ73X8L
          CODE_SIGN_IDENTITY: "DC3A3317CF2BE48DB1F908639EB44E77EDAA98D6"
          PROVISIONING_PROFILE_SPECIFIER: ""
          ONLY_ACTIVE_ARCH: YES
        Release:
          # CODE_SIGN_IDENTITY: "Developer ID Application: MOE AI LLC (NCFNX3LJ83)"
          ONLY_ACTIVE_ARCH: NO
          ARCHS: "arm64 x86_64"

  HerdrMobile:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - Sources/HerdrMobile
      # The Nerd Font symbols fallback for agent-TUI icon glyphs, registered
      # process-wide at launch (same file the macOS target bundles).
      - path: Resources/Fonts
        buildPhase: resources
    dependencies:
      - package: HerdrKit
      - package: HerdrSSH
      - package: HerdrTailcat
      - package: libghostty-spm
        product: GhosttyTerminal
    info:
      path: Sources/HerdrMobile/Info.plist
      properties:
        CFBundleName: herdrm
        CFBundleDisplayName: herdrm
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.developer-tools
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: >-
          herdrm connects to your Macs over SSH on your local network to reach
          the herdr session running on them.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.bybee.herdrm.ios
        PRODUCT_NAME: HerdrMobile
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.10"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: NCFNX3LJ83
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        # The bundled libssh2/OpenSSL xcframeworks ship arm64 device + arm64
        # simulator slices only (see Packages/HerdrSSH/Artifacts/PROVENANCE.md).
        ARCHS: arm64
        ONLY_ACTIVE_ARCH: NO
        EXCLUDED_ARCHS__sdk_iphonesimulator__: x86_64
